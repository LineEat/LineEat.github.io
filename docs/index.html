<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --line:#D9DBD4; --ink:#1B1D1A; --ink-2:#5A5E57; --ink-3:#8B8F87;
  --accent:#C0301C; --accent-ink:#FFFFFF; --accent-soft:#F8E4E0;
  --today:#2F6F42; --today-soft:#DDEEDF; --tomorrow:#8A5A0A; --tomorrow-soft:#F5E9CF;
  --hit:#FFF2A8; --focus:#2456B8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151715; --surface:#1E211E; --line:#33372F; --ink:#EDEEE8; --ink-2:#B3B7AD; --ink-3:#7E8279;
  --accent:#E8503A; --accent-ink:#151715; --accent-soft:#3A221E;
  --today:#7FC58F; --today-soft:#1F3324; --tomorrow:#E2B25C; --tomorrow-soft:#3A2E16;
  --hit:#5A4C10; --focus:#7FA5F0;
}}
:root[data-theme="dark"]{
  --bg:#151715; --surface:#1E211E; --line:#33372F; --ink:#EDEEE8; --ink-2:#B3B7AD; --ink-3:#7E8279;
  --accent:#E8503A; --accent-ink:#151715; --accent-soft:#3A221E;
  --today:#7FC58F; --today-soft:#1F3324; --tomorrow:#E2B25C; --tomorrow-soft:#3A2E16;
  --hit:#5A4C10; --focus:#7FA5F0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-family:"LXGW WenKai TC","Noto Sans TC",serif;font-weight:700;font-size:30px;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{color:var(--ink-3);font-size:13px;font-family:"IBM Plex Mono",monospace}
.toolbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search svg{flex:none;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:12px 0;outline:none;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search button{border:0;background:transparent;color:var(--ink-3);font:inherit;cursor:pointer;padding:6px}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-right:4px;font-family:"IBM Plex Mono",monospace}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.search button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.count{font-size:13px;color:var(--ink-3);margin:14px 0 6px;font-family:"IBM Plex Mono",monospace}
.day{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.day h2{font-family:"LXGW WenKai TC","Noto Sans TC",serif;font-size:22px;font-weight:700;margin:0}
.day .tag{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500}
.tag.today{background:var(--today-soft);color:var(--today)}
.tag.tomorrow{background:var(--tomorrow-soft);color:var(--tomorrow)}
.tag.past{background:var(--line);color:var(--ink-2)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:118px 1fr;gap:4px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.time{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);padding-top:5px;overflow-wrap:anywhere}
.time.na{color:var(--ink-3)}
.time small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;color:var(--ink-3);margin-top:2px}
.name{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.name b{font-family:"LXGW WenKai TC","Noto Sans TC",serif;font-size:21px;font-weight:700;letter-spacing:.01em}
.cat{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px}
.loc{font-size:13px;color:var(--ink-3)}
.items{grid-column:2;margin:4px 0 0;color:var(--ink)}
.prices{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.price{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.price em{font-style:normal;color:var(--accent);font-weight:500}
.notes{grid-column:2;font-size:13px;color:var(--ink-2);margin-top:6px}
.full{grid-column:2;margin-top:8px;font-size:14px}
.full summary{cursor:pointer;color:var(--focus);font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
.full summary::-webkit-details-marker{display:none}
.full summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left-color:var(--focus);border-right:0;transition:transform .15s}
.full[open] summary::before{transform:rotate(90deg)}
.full summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.full .txt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-left:3px solid var(--line);padding:10px 14px;margin-top:8px;border-radius:0 8px 8px 0;line-height:1.7;max-width:62ch}
.full .txt a{color:var(--focus);word-break:break-all}
.pics{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pics button{border:1px solid var(--line);background:var(--bg);padding:0;border-radius:8px;overflow:hidden;cursor:zoom-in;height:96px}
.pics img{display:block;height:100%;width:auto;max-width:200px;object-fit:cover}
.pics button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
dialog.lb{border:0;background:transparent;padding:0;max-width:min(96vw,900px);max-height:96vh}
dialog.lb::backdrop{background:rgba(0,0,0,.72)}
dialog.lb img{display:block;max-width:min(96vw,900px);max-height:88vh;width:auto;height:auto;border-radius:10px;background:var(--surface)}
dialog.lb .cap{color:#fff;font-size:13px;text-align:center;margin-top:8px;font-family:"Noto Sans TC",sans-serif}
mark{background:var(--hit);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}
footer{margin-top:40px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;line-height:1.7}
@media (max-width:560px){.row{grid-template-columns:1fr}.items,.prices,.notes,.pics,.full{grid-column:1}.time{padding-top:0}}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}.row:hover{border-color:var(--ink-3)}}
</style>

  count.textContent = hit.length === DATA.length ? `全部 ${hit.length} 筆` : `找到 ${hit.length} 筆`;
  if (!hit.length) { out.innerHTML = '<div class="empty">沒有符合的餐車。試試餐車名的一部分，或清掉類別篩選。</div>'; return; }
  const byDay = new Map(); for (const r of hit) (byDay.get(r.date) || byDay.set(r.date, []).get(r.date)).push(r);
  const days = [...byDay.keys()].sort((a, b) => (a >= todayStr) === (b >= todayStr) ? (a >= todayStr ? a.localeCompare(b) : b.localeCompare(a)) : (a >= todayStr ? -1 : 1));
  out.innerHTML = days.map(d => {
    const [lbl, tag] = dayLabel(d);
    const rows = byDay.get(d).map(r => {
      const prices = (r.prices || "").split("；").filter(Boolean).map(p => `<span class="price">${hl(p, terms).replace(/(\d+(?:\/\d+)*)(?=[^\d]*$)/, "<em>$1</em>")}</span>`).join("");
      const hitInFull = terms.length && r.fulltext && terms.some(t => r.fulltext.toLowerCase().includes(t) && ![r.truck, r.items, r.prices, r.location, r.notes].join(" ").toLowerCase().includes(t));
      const full = r.fulltext ? `<details class="full"${hitInFull ? " open" : ""}><summary>詳細說明</summary><div class="txt">${linkify(hl(r.fulltext, terms))}</div></details>` : "";
      const imgs = (r.images || "").split("；").map(s => s.trim()).filter(Boolean);
      const pics = imgs.length ? `<div class="pics">${imgs.map(src => `<button type="button" data-src="${esc(src)}" data-cap="${esc(r.truck)} ${esc(r.date)}" aria-label="放大 ${esc(r.truck)} 的圖片"><img src="${esc(src)}" alt="${esc(r.truck)} 的 DM" loading="lazy"></button>`).join("")}</div>` : "";
      return `<div class="row">
        <div class="time ${r.time ? "" : "na"}">${timeHtml(r.time)}</div>
        <div class="name"><b>${hl(r.truck, terms)}</b>${r.category ? `<span class="cat">${esc(r.category)}</span>` : ""}${r.location ? `<span class="loc">${hl(r.location, terms)}</span>` : ""}</div>
        ${r.items ? `<div class="items">${hl(r.items, terms)}</div>` : ""}
        ${prices ? `<div class="prices">${prices}</div>` : ""}
        ${r.notes ? `<div class="notes">${hl(r.notes, terms)}</div>` : ""}
        ${full}
        ${pics}
      </div>`;
    }).join("");
    return `<div class="day"><h2>${lbl}</h2>${tag}</div><div class="list">${rows}</div>`;
  }).join("");
}
const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lbcap = document.getElementById("lbcap");
out.addEventListener("click", e => {
  const b = e.target.closest(".pics button"); if (!b) return;
  lbimg.src = b.dataset.src; lbimg.alt = b.dataset.cap; lbcap.textContent = b.dataset.cap; lb.showModal();
});
lb.addEventListener("click", () => lb.close());
q.addEventListener("input", render);
clearBtn.onclick = () => { q.value = ""; render(); q.focus(); };
try { const saved = localStorage.getItem("q"); if (saved) q.value = saved; } catch (e) {}
q.addEventListener("input", () => { try { localStorage.setItem("q", q.value); } catch (e) {} });
render();
</script>
</body>
</html>
